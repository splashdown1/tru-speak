<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14120f">
<title>TRU SPEAK</title>
<style>
:root{--bg:#14120f;--ink:#f6efe4;--dim:#c4b49a;--line:#3a3024;--sand:#e2c48a;--card:#241c14}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--sand)}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#100e0a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--sand);color:#1a140c;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--sand);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .say{font-size:20px;margin:6px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>SPEAK</span></h1><p class="sub">Fixed lines only. Pashto first. Not a translator.</p></header>
<div class="bar"><input id="q" placeholder="help, lost, sick…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{en:"Help!", ps:"مرسته", say:"MRAS-ta"},
{en:"Look out!", ps:"ګوره", say:"GOH-ra"},
{en:"Watch out!", ps:"پام کوه", say:"PAAM kawa"},
{en:"Stop! Thief!", ps:"ودرېږه! غل", say:"WUD-reh-ga! ghal"},
{en:"I need your help.", ps:"ستاسو مرسته مې په کار ده", say:"STAA-soh MRAS-ta meh pe kaar da"},
{en:"It's an emergency.", ps:"مجبوري ده", say:"maj-boo-REE da"},
{en:"I'm lost.", ps:"زه ورک يم", say:"ze WRUK yem"},
{en:"I'm sick.", ps:"ناروغه يم", say:"naa-ROH-gha yem"},
{en:"I've been injured.", ps:"خوږ شوى يم", say:"khug SHU-wai yem"}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">PASHTO</div><div class="big">${esc(x.en)}</div><div class="say">${esc(x.ps)}</div><div>${esc(x.say)}</div><div class="src">Wikivoyage Pashto phrasebook. A line not listed is a gap. Dari is not packed.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("")+`<article class="card"><div class="k">GAP</div><div class="big">No translator</div><div>This ship does not turn your sentence into another language. Fiber down is why the line is already here. Dari, Arabic, and a doctor line past this list are not packed.</div></article>`;}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.en+" "+x.say).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented translation.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
